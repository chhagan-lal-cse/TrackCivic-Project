services:
  # -------------------------------------------------------------
  # 1. Database: MongoDB
  # -------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: trackcivic-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - trackcivic-network

  # -------------------------------------------------------------
  # 2. Frontend + Backend (All-In-One Unified Server)
  # -------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trackcivic-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/TrackCivic
      - JWT_SECRET=0b74e8df655815aa32819c6a20efeaff4a564a6b1c1958f7b1886ad8c83ab87bb0114c7583d25bcfc313f9e9f8537e73
      - JWT_EXPIRES_IN=1d
      - CLIENT_ORIGIN=http://localhost:5000
      - COOKIE_SECURE=false
      - COOKIE_SAME_SITE=lax
      - MAX_UPLOAD_MB=2
      - CITIZEN_EDITABLE_STATUSES=Pending
      - ADMIN_NAME=Chhagan Lal
      - ADMIN_EMAIL=chhaganlal07@gmail.com
      - ADMIN_PASSWORD=Chha@9680
    depends_on:
      - mongo
    volumes:
      - uploads_data:/app/uploads
    networks:
      - trackcivic-network

volumes:
  mongo_data:
  uploads_data:

networks:
  trackcivic-network:
    driver: bridge
